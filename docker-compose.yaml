version: '3.9'

services:
  yf-wrapper:
    build:
      context: https://github.com/MichaelFlucher/yf-rest_wrapper.git
      dockerfile: Dockerfile
    container_name: yf-wrapper
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard
    depends_on:
      - yf-wrapper
      - migrate
      - pg-data
  pg-data:
    image: postgres:15
    container_name: pg-data
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: migrate
    working_dir: /app
    depends_on:
      - pg-data


volumes:
  pgdata:
